server {
    listen 80;
    server_name coderhero.duncowebsolutions.co.ke;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coderhero.duncowebsolutions.co.ke;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html/public;
    index index.html index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API routes - proxy to Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel storage (uploaded files)
    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sitemap and robots
    location /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }
    location /robots.txt {
        try_files $uri /index.php?$query_string;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # React SPA - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /build/index.html;
    }

    # PHP-FPM (for API and other backend routes)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Deny sensitive files
    location ~* (\.env|composer\.(json|lock)|package\.json|\.git) {
        deny all;
    }

    # Upload limit
    client_max_body_size 64M;
}
